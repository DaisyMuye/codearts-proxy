# DSH 接入示例
#
# 放到 ~/.dsh/profiles/<实际profile>/cordis.patch.yml 的顶层数组里。
#
# 注意：先用下面这条命令确认实际运行的是哪个 profile（desktop / web），改错了不生效：
#   powershell -c "Get-CimInstance Win32_Process | ? {$_.CommandLine -like '*dsh*'} | % CommandLine"
#
# 原理：llm-pi-ai 在 dsh-base bundle 里已是休眠挂载（id: llm-pi-ai），
#      这里用相同 id 覆盖它的 config 来注册路由，不要 insert 新实例。
#
# 凭据：写进 ~/.dsh/.credentials.yaml 的 refs:
#   refs:
#     CODEARTS_KEY: sk-local

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      codearts:
        displayName: 码道 CodeArts
        apiKeyEnv: CODEARTS_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:18000/v1
        defaultContextWindow: 262144
        defaultMaxTokens: 32768
        models:
          - id: deepseek-v4.1-flash-1017
            name: DeepSeek V4.1 Flash
            contextWindow: 1048576
            maxTokens: 65536
            reasoningEfforts: false
          # 按需打开其余模型
          # - id: glm-5.3-flash
          #   name: GLM-5.3 Flash
          #   contextWindow: 1048576
          #   maxTokens: 65536
